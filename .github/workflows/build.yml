name: Build TrollVNC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FINALPACKAGE: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install xcbeautify ldid-procursus p7zip make

      - name: Checkout roothide/theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive

      - name: Install iOS SDKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos-roothide"
          cd "$THEOS"
          ./bin/install-sdk iPhoneOS16.5
          ./bin/install-sdk iPhoneOS14.5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Build TrollStore package
        run: |
          source devkit/bootstrap.sh
          FINALPACKAGE=1 gmake messages=yes clean package

      - name: Upload TrollStore package
        uses: actions/upload-artifact@v4
        with:
          name: packages-bootstrap
          path: packages/*.tipa
          if-no-files-found: error
          retention-days: 3
